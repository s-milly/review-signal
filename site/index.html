<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Signal</title>
<style>
:root {
  color-scheme: light;
  --paper: #f5f2ea; --sheet: #fbf9f4; --well: #ece8dd;
  --ink: #1c1b18; --ink-2: #55524a; --muted: #6f6b61;
  --rule: #ddd7c9; --rule-strong: #1c1b18; --axis: #bdb6a4;
  --s1: #2a62a8; --sig: #c4422a; --s3: #1f8a70;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(28,27,24,0.06), 0 8px 24px rgba(28,27,24,0.10);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --serif: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  font: 15px/1.5 var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #151412; --sheet: #1d1b18; --well: #262420;
    --ink: #ece8de; --ink-2: #b9b3a5; --muted: #948e81;
    --rule: #2e2b26; --rule-strong: #ece8de; --axis: #4a463e;
    --s1: #4f8fdc; --sig: #e0613f; --s3: #2fa383;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.45);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 600; text-wrap: balance; letter-spacing: -0.005em; }
p, ul, dl, dd { margin: 0; }
p { text-wrap: pretty; }
.small { font-size: 13px; color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 2px; }
button, select, input, summary { -webkit-tap-highlight-color: transparent; }

.test-banner { background: var(--warning); color: #1c1b18; padding: 8px 28px; font-weight: 600; font-size: 14px; }

/* masthead */
.mast { border-bottom: 1px solid var(--rule-strong); }
.mast-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; padding: 28px 28px 22px; }
.mast h1 { font-size: 40px; line-height: 1.05; margin-top: 6px; }
.deck { font-family: var(--serif); font-size: 19px; color: var(--ink-2); margin-top: 8px; font-style: italic; }
.facts { display: grid; grid-auto-flow: column; gap: 0; }
.facts div { padding: 0 22px; border-left: 1px solid var(--rule); }
.facts div:first-child { border-left: 0; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }

/* layout */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
aside { border-right: 1px solid var(--rule); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
.list-tools { padding: 18px 16px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--rule); }
input[type=search], select { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--axis); background: var(--sheet); color: var(--ink); }
.list { overflow-y: auto; overscroll-behavior: contain; flex: 1; }
.list button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; align-items: center;
  font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px 16px 11px; cursor: pointer;
  transition: background-color 120ms ease; }
.list button[aria-current="true"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--ink); }
@media (hover: hover) and (pointer: fine) { .list button:hover { background: var(--sheet); } }
.list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
.list .pc { font-size: 13px; color: var(--ink-2); text-align: right; }
.list .meter { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 56px; align-items: center; gap: 8px; }
.list .meter .stamp { justify-self: end; }
.list .bar { height: 3px; background: var(--well); border-radius: 2px; position: relative; overflow: hidden; }
.list .bar i { position: absolute; inset: 0 auto 0 0; background: var(--sig); border-radius: 2px; }
.stamp { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--axis); border-radius: 3px; padding: 0 5px; line-height: 16px; flex: none; }

main { padding: 26px 32px 64px; align-self: start; display: grid; gap: 34px; align-content: start; max-width: 1180px; }
.file-head { display: grid; gap: 6px; }
.file-head .title { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.file-head h2 { font-size: 32px; line-height: 1.1; }
.meta { font-size: 14px; color: var(--ink-2); }

.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.fig { padding: 16px 20px 18px; border-left: 1px solid var(--rule); display: grid; gap: 4px; align-content: start; }
.fig:first-child { border-left: 0; padding-left: 0; }
.fig .v { font-size: 34px; font-weight: 600; line-height: 1.1; letter-spacing: -0.015em; }
.fig .d { font-size: 13px; color: var(--ink-2); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.status i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* sections */
.sec { border-top: 1px solid var(--rule-strong); padding-top: 12px; display: grid; gap: 14px; align-content: start; }
.sec-label { display: flex; gap: 10px; align-items: baseline; }
.sec-label b { font-size: 11px; font-weight: 700; color: var(--sig); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.sec h3 { font-size: 21px; line-height: 1.2; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.key-line { width: 18px; height: 2px; background: var(--s1); display: inline-block; border-radius: 1px; }
.key-dash { width: 18px; height: 0; border-top: 2px dashed var(--s1); display: inline-block; }
.key-band { width: 18px; height: 10px; background: color-mix(in srgb, var(--s1) 16%, transparent); display: inline-block; border-radius: 2px; }
.key-dot { width: 9px; height: 9px; background: var(--s3); border-radius: 50%; display: inline-block; }
.key-sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--sheet); border: 1px solid transparent; border-radius: 8px;
  box-shadow: var(--shadow); padding: 9px 11px; font-size: 13px; min-width: 150px; opacity: 0; transition: opacity 120ms ease; }
.tip.on { opacity: 1; }
.tip b { font-size: 14px; }
.tip .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }

.themes, .drivers { display: grid; gap: 11px; }
.theme { display: grid; grid-template-columns: 104px minmax(0, 1fr) 96px; gap: 12px; align-items: center; font-size: 14px; }
.track { position: relative; height: 8px; background: var(--well); border-radius: 4px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 4px; }
.fill.worse { background: var(--sig); }
.typ { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); border-radius: 1px; }
.chg { font-size: 13px; color: var(--ink-2); text-align: right; }
.drv { display: grid; grid-template-columns: 112px minmax(0, 1fr) 52px; gap: 12px; align-items: center; font-size: 14px; }
.drv .bar { position: relative; height: 8px; }
.drv .zero { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--axis); }
.drv .b { position: absolute; top: 0; bottom: 0; }
.drv .b.risk-up { left: 50%; background: var(--sig); border-radius: 0 4px 4px 0; }
.drv .b.risk-down { right: 50%; background: var(--s1); border-radius: 4px 0 0 4px; }
.drv .val { text-align: right; font-size: 13px; color: var(--ink-2); }
.note { font-size: 13px; color: var(--muted); }

/* findings */
.findings { background: var(--sheet); border-top-width: 2px; padding: 18px 32px 30px; margin: 0 -32px -64px; gap: 22px; }
.pull { font-family: var(--serif); font-size: 28px; line-height: 1.2; max-width: 30ch; }
.pull em { color: var(--sig); font-style: normal; }
.lede { font-size: 16px; max-width: 70ch; color: var(--ink-2); }
.findings h4 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.findings ul { padding-left: 18px; display: grid; gap: 8px; }
.findings li::marker { color: var(--sig); }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--rule); }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
th:first-child, td:first-child { padding-left: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.win { font-weight: 700; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); width: fit-content; }
.empty { padding: 40px 0; color: var(--ink-2); }

/* first load only: sections arrive in order */
@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: rise 300ms var(--ease-out) both; }
  .enter > *:nth-child(2) { animation-delay: 100ms; }
  .enter > *:nth-child(3) { animation-delay: 200ms; }
  .enter > *:nth-child(4) { animation-delay: 300ms; }
  .enter > *:nth-child(n+5) { animation-delay: 400ms; }
}
@media (prefers-reduced-motion: reduce) {
  .enter > * { animation: fade 300ms ease both; }
  .tip, .list button { transition: none; }
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }
@keyframes fade { from { opacity: 0; } }

@media (max-width: 1100px) {
  .mast-in { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .facts div:first-child { padding-left: 0; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); }
  .list { max-height: 260px; }
  main { padding: 22px 18px 48px; gap: 28px; }
  .mast-in { padding: 22px 18px 18px; }
  .mast h1 { font-size: 32px; }
  .deck { font-size: 17px; }
  .facts { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .facts div { padding: 0 12px; }
  .facts dd { font-size: 20px; }
  .figures { grid-template-columns: 1fr 1fr; }
  .fig:nth-child(3) { border-left: 0; padding-left: 0; }
  .fig:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .fig { padding: 14px 14px 16px; }
  .fig .v { font-size: 28px; }
  .two { grid-template-columns: 1fr; gap: 28px; }
  .theme { grid-template-columns: 92px minmax(0, 1fr) 88px; gap: 10px; }
  .drv { grid-template-columns: 100px minmax(0, 1fr) 48px; gap: 10px; }
  .findings { margin: 0 -18px -48px; padding: 16px 18px 28px; }
  .pull { font-size: 23px; }
  .file-head h2 { font-size: 27px; }
  .list-tools { padding: 14px 18px; }
  .list button { padding: 10px 18px 11px; }
  .test-banner { padding: 8px 18px; }
}
</style>
</head>
<body>
<div id="banner"></div>
<header class="mast">
  <div class="mast-in">
    <div>
      <p class="kicker" id="kicker">Case study</p>
      <h1>Review Signal</h1>
      <p class="deck">Reviews tell you why. Traffic history tells you how much.</p>
    </div>
    <dl class="facts" id="facts"></dl>
  </div>
</header>
<div class="app">
  <aside aria-label="Restaurants">
    <div class="list-tools">
      <p class="kicker">Restaurants</p>
      <input type="search" id="q" placeholder="Search by name or street" aria-label="Search restaurants">
      <select id="sort" aria-label="Sort restaurants">
        <option value="risk">Highest closure risk</option>
        <option value="drop">Biggest forecast drop</option>
        <option value="name">Name, A to Z</option>
      </select>
    </div>
    <div class="list" id="list" role="list"></div>
  </aside>
  <main id="main"><p class="empty">Loading data…</p></main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k === "text" ? e.textContent = v : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "K" : Math.round(n).toLocaleString();
const pct = (x, digits = 0) => { const v = +(x * 100).toFixed(digits); return (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toFixed(digits) + "%"; };
const monthName = m => new Date(m + "-01T12:00").toLocaleDateString("en-US", { month: "short", year: "numeric" });
const addMonths = (m, n) => { const d = new Date(m + "-01T12:00"); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 7); };

let D, current, unit = "check-ins", maxRisk = 1;

function riskStatus(r) {
  const x = r / Math.max(D.base_close_rate, 1e-6);
  if (x < 1) return ["good", "Low"];
  if (x < 2) return ["warning", "Elevated"];
  if (x < 3.5) return ["serious", "High"];
  return ["critical", "Very high"];
}
function status(r) {
  const [k, label] = riskStatus(r);
  return el("span", { class: "status" }, el("i", { style: `background: var(--${k})`, "aria-hidden": "true" }), label);
}

function topClosed() {
  const all = D.businesses, top = [...all].sort((a, b) => b.risk - a.risk).slice(0, 20);
  return { c: top.filter(b => b.closed_later).length, t: all.filter(b => b.closed_later).length, n: all.length };
}

function renderFacts() {
  const s = D.study || {}, tc = topClosed();
  const fact = (dt, dd) => el("div", {}, el("dt", { text: dt }), el("dd", { text: dd }));
  $("#facts").replaceChildren(
    fact("Reviews read", s.reviews ? s.reviews.toLocaleString() : "n/a"),
    fact("Restaurants", s.restaurants ? s.restaurants.toLocaleString() : D.businesses.length.toLocaleString()),
    fact("Riskiest 20 that closed", `${tc.c} of 20`));
}

function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let rows = D.businesses.filter(b => !q || b.name.toLowerCase().includes(q) || (b.address || "").toLowerCase().includes(q));
  const drop = b => b.forecast / Math.max(b.last3, 1) - 1;
  rows.sort(sort === "risk" ? (a, b) => b.risk - a.risk : sort === "drop" ? (a, b) => drop(a) - drop(b) : (a, b) => a.name.localeCompare(b.name));
  const list = $("#list");
  if (!rows.length) { list.replaceChildren(el("p", { class: "small", style: "padding:14px 16px", text: "No restaurants match that search." })); return; }
  list.replaceChildren(...rows.map(b => {
    const btn = el("button", { "aria-current": String(b === current), role: "listitem",
      "aria-label": `${b.name}, closure risk ${(b.risk * 100).toFixed(0)} percent${b.closed_later ? ", later closed" : ""}` },
      el("span", { class: "nm", text: b.name }),
      el("span", { class: "pc num", text: (b.risk * 100).toFixed(0) + "%" }),
      el("span", { class: "meter" },
        el("span", { class: "bar" }, el("i", { style: `width:${Math.max(2, (b.risk / maxRisk) * 100)}%` })),
        b.closed_later ? el("span", { class: "stamp", text: "Closed" }) : el("span")));
    btn.onclick = () => { current = b; history.replaceState(null, "", "#" + encodeURIComponent(b.id)); renderList(); renderMain(); };
    return btn;
  }));
}

function missText(f, a) {
  if (a === 0) return f < 1 ? "The forecast was close." : `None were recorded; the forecast said ${fmt(f)}.`;
  const d = Math.round((f / Math.max(a, 1) - 1) * 100);
  return d === 0 ? "The forecast was right on." : `The forecast was ${Math.abs(d)}% ${d < 0 ? "low" : "high"}.`;
}

function fig(label, value, detail, extra) {
  return el("div", { class: "fig" }, el("p", { class: "kicker", text: label }), el("p", { class: "v", text: value }), extra || null,
    detail ? el("p", { class: "d", text: detail }) : null);
}

function section(n, kicker, title, cls = "") {
  return el("section", { class: "sec " + cls },
    el("div", { class: "sec-label" }, el("b", { text: String(n).padStart(2, "0") }), el("span", { class: "kicker", text: kicker })),
    title ? el("h3", { text: title }) : null);
}

function renderMain(first = false) {
  const b = current, main = $("#main");
  if (!b) { main.replaceChildren(el("p", { class: "empty", text: "No restaurants match." })); return; }
  const change = b.forecast / Math.max(b.last3, 1) - 1;
  const head = el("div", { class: "file-head" },
    el("p", { class: "kicker", text: `Restaurant file, as of ${monthName(D.asof)}` }),
    el("div", { class: "title" }, el("h2", { text: b.name }),
      b.closed_later ? el("span", { class: "stamp", text: "Closed by early 2022" }) : null),
    el("p", { class: "meta", text: [b.address, (b.categories || "").split(",").slice(0, 3).join(", ")].filter(Boolean).join(" · ") }));

  const figures = el("div", { class: "figures" },
    fig("Forecast, next 3 months", fmt(b.forecast), `${unit}, likely ${fmt(b.low)} to ${fmt(b.high)}`),
    b.last3 < 1
      ? fig("Change vs last 3 months", "None before", `No ${unit} in the last 3 months`)
      : fig("Change vs last 3 months", pct(change), `Last 3 months: ${fmt(b.last3)} ${unit}`),
    fig("Closure risk, 12 months", (b.risk * 100).toFixed(0) + "%",
      `Typical restaurant: ${(D.base_close_rate * 100).toFixed(0)}%`, status(b.risk)),
    b.actual == null
      ? fig("What actually happened", "Not yet known", "")
      : fig("What actually happened", fmt(b.actual), `${unit} in the 3 months after. ${missText(b.forecast, b.actual)}`));

  main.classList.toggle("enter", first);
  main.replaceChildren(head, figures, trafficCard(b), el("div", { class: "two" }, themesCard(b), driversCard(b)), findingsCard());
  if (first) setTimeout(() => main.classList.remove("enter"), 1000);
}

function trafficCard(b) {
  const card = section(1, "Traffic", `Monthly ${unit}, and the forecast made in ${monthName(D.asof)}`);
  card.append(el("div", { class: "legend" },
    el("span", {}, el("i", { class: "key-line" }), "Known at forecast time"),
    el("span", {}, el("i", { class: "key-dash" }), "Forecast"),
    el("span", {}, el("i", { class: "key-band" }), "Likely range"),
    el("span", {}, el("i", { class: "key-dot" }), "What actually happened")));
  const months = []; for (let i = -23; i <= 3; i++) months.push(addMonths(D.asof, i));
  const byM = Object.fromEntries(b.history.map(h => [h.m, h]));
  const firstM = b.history.length ? b.history[0].m : months[0];
  const known = months.slice(0, 24).map(m => m < firstM ? null : byM[m] ? byM[m].t : 0);
  const after = months.slice(24).map(m => byM[m] ? byM[m].t : null);
  const f = { mid: b.forecast / 3, lo: b.low / 3, hi: b.high / 3 };
  // draw at the real width so text stays 12px on phones
  const W = Math.max(300, Math.min(1120, $("#main").clientWidth - (innerWidth > 860 ? 64 : 36))), H = W < 600 ? 220 : 270;
  const L = 40, R = 12, T = 14, B = 28;
  const ymax = Math.max(...known.filter(v => v != null), ...after.filter(v => v != null), f.hi) * 1.1 || 1;
  const step = niceStep(ymax / 4);
  const top = Math.ceil(ymax / step) * step;
  const x = i => L + (i / (months.length - 1)) * (W - L - R);
  const y = v => T + (1 - v / top) * (H - T - B);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `${b.name}: monthly ${unit} for 24 months, forecast of ${fmt(b.forecast)} for the next 3 months` });
  // shade the forecast window so "before" and "after" read at a glance
  svg.append(svgEl("rect", { x: x(23), y: T, width: x(26) - x(23), height: H - T - B, fill: "var(--well)", opacity: 0.6 }));
  for (let v = 0; v <= top + 1e-9; v += step) {
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--rule)", "stroke-width": 1 }));
    const t = svgEl("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }); t.textContent = fmt(v); svg.append(t);
  }
  months.forEach((m, i) => {
    if (i > 23 || (23 - i) % 6 !== 0) return;
    const t = svgEl("text", { x: x(i), y: H - 8, "text-anchor": "middle" }); t.textContent = monthName(m); svg.append(t);
  });
  const i0 = 23, i1 = 26;
  svg.append(svgEl("path", { d: `M${x(i0)},${y(known[23])} L${x(i0 + 1)},${y(f.hi)} L${x(i1)},${y(f.hi)} L${x(i1)},${y(f.lo)} L${x(i0 + 1)},${y(f.lo)} Z`,
    fill: "var(--s1)", "fill-opacity": 0.14 }));
  svg.append(svgEl("path", { d: `M${x(i0)},${y(known[23])} L${x(i0 + 1)},${y(f.mid)} L${x(i1)},${y(f.mid)}`,
    fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-dasharray": "5 4", "stroke-linecap": "round" }));
  const nowT = svgEl("text", { x: x(i0) - 6, y: T + 10, "text-anchor": "end" }); nowT.textContent = "Forecast made"; svg.append(nowT);
  svg.append(svgEl("path", { d: known.map((v, i) => v == null ? "" : `${i && known[i - 1] != null ? "L" : "M"}${x(i)},${y(v)}`).join(" "),
    fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  svg.append(svgEl("circle", { cx: x(23), cy: y(known[23] ?? 0), r: 4, fill: "var(--s1)", stroke: "var(--paper)", "stroke-width": 2 }));
  after.forEach((v, j) => { if (v != null) svg.append(svgEl("circle", { cx: x(24 + j), cy: y(v), r: 4.5, fill: "var(--s3)", stroke: "var(--paper)", "stroke-width": 2 })); });

  const wrap = el("div", { class: "chart" }, svg);
  const tip = el("div", { class: "tip", role: "status" });
  const cross = svgEl("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, opacity: 0 });
  svg.append(cross);
  const hit = svgEl("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent", tabindex: 0,
    "aria-label": "Chart readout. Use the left and right arrow keys to move between months." });
  svg.append(hit);
  const show = i => {
    const m = months[i];
    const rows = [];
    if (i <= 23) rows.push(known[i] == null ? ["No data yet", "", null] : [fmt(known[i]), unit, "var(--s1)"]);
    else {
      rows.push([`${fmt(f.mid)} (${fmt(f.lo)} to ${fmt(f.hi)})`, "forecast", "var(--s1)"]);
      if (after[i - 24] != null) rows.push([fmt(after[i - 24]), "actual", "var(--s3)"]);
    }
    const h = byM[m];
    if (h && h.n) rows.push([`${h.n} review${h.n === 1 ? "" : "s"}, ${h.stars} stars avg`, "", null]);
    tip.replaceChildren(el("div", { class: "small", text: monthName(m) }),
      ...rows.map(([v, lab, c]) => el("div", { class: "row" }, c ? el("i", { style: `width:12px;height:2px;background:${c};display:inline-block` }) : null,
        el("b", { text: v }), lab ? el("span", { class: "small", text: lab }) : null)));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    const box = svg.getBoundingClientRect(), px = (x(i) / W) * box.width;
    tip.style.left = Math.max(0, Math.min(px + 12, box.width - 230)) + "px"; tip.style.top = "8px";
    tip.classList.add("on");
  };
  const hide = () => { tip.classList.remove("on"); cross.setAttribute("opacity", 0); };
  let last = 23;
  hit.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect(), vx = ((e.clientX - box.left) / box.width) * W;
    last = Math.max(0, Math.min(months.length - 1, Math.round(((vx - L) / (W - L - R)) * (months.length - 1))));
    show(last);
  });
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("focus", () => show(last));
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); show(last = Math.min(months.length - 1, last + 1)); }
    if (e.key === "ArrowLeft") { e.preventDefault(); show(last = Math.max(0, last - 1)); }
  });
  wrap.append(tip);

  const table = el("table", {}, el("thead", {}, el("tr", {}, el("th", { text: "Month" }), el("th", { class: "r", text: unit }),
    el("th", { class: "r", text: "Reviews" }), el("th", { class: "r", text: "Avg stars" }))),
    el("tbody", {}, ...months.map((m, i) => {
      const h = byM[m];
      return el("tr", {}, el("td", { text: monthName(m) + (i > 23 ? " (after forecast)" : "") }),
        el("td", { class: "r", text: h ? fmt(h.t) : "0" }), el("td", { class: "r", text: h ? h.n : "0" }),
        el("td", { class: "r", text: h && h.stars != null ? h.stars : "" }));
    })));
  card.append(wrap, el("details", {}, el("summary", { text: "Show as a table" }), table));
  return card;
}

function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-9)))), r = x / p;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * p;
}

function themesCard(b) {
  const card = section(2, "Complaints", "What customers complain about");
  card.append(el("p", { class: "small", text: "Share of reviews in the last 3 months with a complaint about each theme. The tick marks a typical restaurant." }));
  const max = Math.max(...Object.values(b.themes).map(t => Math.max(t.now, t.typical))) * 1.15 || 1;
  const list = el("div", { class: "themes" });
  for (const [k, t] of Object.entries(b.themes)) {
    const worse = t.now > t.typical * 1.15;
    const pts = Math.round(t.change * 100);
    const said = `${D.themes[k]}: ${(t.now * 100).toFixed(0)} percent of reviews, typical ${(t.typical * 100).toFixed(0)} percent, ${pts > 0 ? "up" : pts < 0 ? "down" : "no change"} ${Math.abs(pts)} points`;
    list.append(el("div", { class: "theme" },
      el("span", { text: D.themes[k] }),
      el("div", { class: "track", role: "img", "aria-label": said },
        el("div", { class: "fill" + (worse ? " worse" : ""), style: `width:${(t.now / max) * 100}%` }),
        el("div", { class: "typ", style: `left:calc(${(t.typical / max) * 100}% - 1px)` })),
      el("span", { class: "chg num", text: `${(t.now * 100).toFixed(0)}% (${pts > 0 ? "+" : ""}${pts} pts)` })));
  }
  card.append(list, el("div", { class: "legend" },
    el("span", {}, el("i", { class: "key-sq", style: "background:var(--sig)" }), "Well above typical"),
    el("span", {}, el("i", { class: "key-sq", style: "background:var(--s1)" }), "Near or below typical")),
    el("p", { class: "note", text: "Points compare with the 12 months before." }));
  return card;
}

function driversCard(b) {
  const card = section(3, "Closure risk", "What drives the closure risk");
  card.append(el("p", { class: "small", text: "How much each factor changes this restaurant's chance of closing, compared with a typical one." }));
  const logs = b.drivers.map(d => Math.log(d.times));
  const max = Math.min(Math.max(...logs.map(Math.abs), Math.log(1.25)), Math.log(10));
  const list = el("div", { class: "drivers" });
  b.drivers.forEach((d, i) => {
    const w = Math.min(50, (Math.abs(logs[i]) / max) * 50);
    const up = d.times >= 1;
    const label = d.times >= 10 ? "10x+" : `${d.times.toFixed(1)}x`;
    const said = up ? `${d.name} makes closing ${d.times.toFixed(1)} times as likely` : `${d.name} lowers the chance of closing to ${d.times.toFixed(1)} times`;
    list.append(el("div", { class: "drv" },
      el("span", { text: d.name }),
      el("div", { class: "bar", role: "img", "aria-label": said },
        el("div", { class: "zero" }), el("div", { class: "b " + (up ? "risk-up" : "risk-down"), style: `width:${w}%` })),
      el("span", { class: "val num", text: label })));
  });
  card.append(list, el("div", { class: "legend" },
    el("span", {}, el("i", { class: "key-sq", style: "background:var(--sig)" }), "Raises risk"),
    el("span", {}, el("i", { class: "key-sq", style: "background:var(--s1)" }), "Lowers risk")));
  return card;
}

function findingsCard() {
  const m = D.metrics, tc = topClosed();
  const card = section(4, "What we tested", null, "findings");
  card.append(
    el("p", { class: "pull" }, "We expected reviews to predict sales. ", el("em", { text: "They did not." }), " So we changed the product."),
    el("p", { class: "lede", text: `The idea: reviews warn you about a drop in business before your sales do, so a forecast that reads them should beat one that only looks at past traffic. Models learned from earlier months, then forecast months they never saw, across ${m.traffic.businesses.toLocaleString()} restaurants.` }));
  const p1 = x => (x * 100).toFixed(1) + "%";
  const cell = (v, win, f) => el("td", { class: "r" + (win ? " win" : ""), text: f(v) });
  card.append(el("div", { class: "two" },
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Traffic forecast, typical miss" }), el("th", { class: "r", text: "History only" }), el("th", { class: "r", text: "Plus reviews" }))),
      el("tbody", {}, ...m.horizons.map(h => el("tr", {}, el("td", { text: `${h.months} months ahead` }),
        cell(h.history, p1(h.history) !== p1(h.reviews) && h.history < h.reviews, p1), cell(h.reviews, p1(h.history) !== p1(h.reviews) && h.reviews < h.history, p1))))),
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Closure ranking, AUC" }), el("th", { class: "r", text: "History only" }), el("th", { class: "r", text: "Plus reviews" }))),
      el("tbody", {}, ...m.closure.map(c => el("tr", {}, el("td", { text: `Test year ${c.year}` }),
        cell(c.history.auc, c.history.auc.toFixed(2) > c.reviews.auc.toFixed(2), v => v.toFixed(2)),
        cell(c.reviews.auc, c.reviews.auc.toFixed(2) > c.history.auc.toFixed(2), v => v.toFixed(2))))))));
  card.append(el("p", { class: "note", text: "Bold marks the better result where they differ. For the forecast, a lower miss is better; for closure ranking, a higher AUC is better." }));
  card.append(el("div", { class: "two" },
    el("div", {}, el("h4", { text: "What we found" }), el("ul", {},
      el("li", { text: "Reviews did not improve the traffic forecast at any range. Past traffic already holds what the reviews would have told us." }),
      el("li", { text: "Reviews did help flag restaurants likely to close: clearly in 2017, slightly in 2018." }),
      el("li", { text: `Of the 20 restaurants ranked riskiest in ${monthName(D.asof)}, ${tc.c} had closed by the time the data ends in early 2022, against ${tc.t} of all ${tc.n} (${Math.round(tc.t / tc.n * 100)}%).` }),
      el("li", { text: "Reviews are the only place that says why customers are unhappy." }))),
    el("div", {}, el("h4", { text: "What we changed" }), el("ul", {},
      el("li", { text: "The forecast on this page uses traffic history only, because it tested best." }),
      el("li", { text: "Reviews feed the closure risk and the complaint breakdown, where they add something." }),
      el("li", { text: "We dropped a planned “fix this complaint, gain this much” slider. The data did not support that promise." }),
      el("li", { text: `The forecast's likely range held the real result ${(m.traffic.range_coverage * 100).toFixed(0)}% of the time, against a target of 80%.` })))));
  return card;
}

(async function init() {
  const src = new URLSearchParams(location.search).get("data") || "data.json";
  D = window.__DATA || await (await fetch(src)).json();
  maxRisk = Math.max(...D.businesses.map(b => b.risk), 1e-6);
  if (/test/i.test(D.label || "")) $("#banner").replaceChildren(el("div", { class: "test-banner", text: "Test data: these businesses and numbers are fake and only for checking the page." }));
  $("#kicker").textContent = `Case study · ${D.label || "Yelp Open Dataset"}`;
  renderFacts();
  const id = decodeURIComponent(location.hash.slice(1));
  // open on the riskiest restaurant that still had real traffic, so the chart has something to show
  current = D.businesses.find(b => b.id === id) || D.businesses.find(b => b.last3 >= 15 && b.actual != null) || D.businesses[0];
  $("#q").oninput = () => renderList();
  $("#sort").oninput = () => renderList();
  renderList(); renderMain(true);
  let lastW = innerWidth, t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; renderMain(); } }, 150); });
})();
</script>
